name: build-obfuscate
# 私有仓 push 后自动混淆 a.js / a.py，推到公开仓供启动器拉取。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_REPO: gxjxzgx/botp-dist   # 公开发布仓
  PUBLIC_BRANCH: main

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (private)
        uses: actions/checkout@v4

      # ---------- a.js ----------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Obfuscate a.js
        run: |
          npm i -g javascript-obfuscator@4
          mkdir -p dist
          javascript-obfuscator a.js --output dist/a.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.4 \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75 \
            --rename-globals false \
            --self-defending false
          node --check dist/a.js   # 确认混淆后仍是合法 CommonJS

      # ---------- a.py ----------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obfuscate a.py
        run: |
          pip install pyarmor
          pyarmor gen --output dist_py a.py
          cp -r dist_py/* dist/        # a.py + pyarmor_runtime_* 一起发布
          python -m py_compile dist/a.py

      # ---------- 推送到公开仓 ----------
      - name: Publish to public repo
        env:
          PUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git clone --depth 1 -b "$PUBLIC_BRANCH" \
            "https://x-access-token:${PUB_TOKEN}@github.com/${PUBLIC_REPO}.git" pub
          cp -r dist/* pub/
          cd pub
          git config user.name  "obf-bot"
          git config user.email "obf-bot@users.noreply.github.com"
          git add -A
          git commit -m "obfuscated build ${GITHUB_SHA::7}" || echo "no changes"
          git push origin "$PUBLIC_BRANCH"
